services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: sql-vault:local
    container_name: sql-vault
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-file:/data/dev.db}
    volumes:
      - sql_vault_data:/data
    restart: unless-stopped

volumes:
  sql_vault_data:
