name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block unexpected high and critical findings
        run: node scripts/check-audit.mjs

      - name: Report complete npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
