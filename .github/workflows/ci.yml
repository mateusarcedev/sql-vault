name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://sqlvault:sqlvault@localhost:5432/sqlvault?schema=public
  AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
  AI_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqlvault
          POSTGRES_PASSWORD: sqlvault
          POSTGRES_DB: sqlvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlvault -d sqlvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate production environment contract
        env:
          NODE_ENV: production
        run: npm run env:check

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate:deploy

      - name: Verify PostgreSQL migration status
        run: npx prisma migrate status

      - name: Verify PostgreSQL schema
        run: |
          node <<'NODE'
          const { Client } = require('pg')

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL })
            await client.connect()

            const tables = await client.query(
              "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public'"
            )
            const tableNames = new Set(tables.rows.map((row) => row.table_name))

            for (const expected of ['User', 'Query', 'Routine', 'DatabaseContext', 'ApiKey']) {
              if (!tableNames.has(expected)) {
                throw new Error(`Missing expected table: ${expected}`)
              }
            }

            const indexes = await client.query(
              "SELECT indexname FROM pg_indexes WHERE schemaname = 'public'"
            )
            const indexNames = new Set(indexes.rows.map((row) => row.indexname))

            for (const expected of [
              'Query_userId_isPublic_idx',
              'Query_databaseId_idx',
              'Routine_userId_isPublic_idx',
              'Routine_databaseId_idx',
              'DatabaseContext_userId_isPublic_idx',
              'ApiKey_tokenHash_key',
            ]) {
              if (!indexNames.has(expected)) {
                throw new Error(`Missing expected index: ${expected}`)
              }
            }

            await client.end()
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Verify demo seed is opt-in
        run: |
          if npm run db:seed:demo; then
            echo "Demo seed unexpectedly ran without ALLOW_DEMO_SEED=true"
            exit 1
          fi
          echo "Demo seed correctly refused to run without explicit opt-in"

      - name: Validate idempotent demo seed
        env:
          ALLOW_DEMO_SEED: "true"
        run: |
          npm run db:seed:demo
          npm run db:seed:demo
          node <<'NODE'
          const { Client } = require('pg')

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL })
            await client.connect()

            const email = 'demo@sqlvault.local'
            const userResult = await client.query(
              'SELECT "id" FROM "User" WHERE "email" = $1',
              [email]
            )

            if (userResult.rowCount !== 1) {
              throw new Error('Demo user was not seeded exactly once')
            }

            const userId = userResult.rows[0].id
            const expectedCounts = [
              ['Tag', 4],
              ['Query', 3],
              ['Routine', 1],
              ['DatabaseContext', 1],
              ['QueryVersion', 2],
              ['RoutineVersion', 1],
            ]

            for (const [table, expected] of expectedCounts) {
              const relationColumn =
                table === 'QueryVersion' || table === 'RoutineVersion'
                  ? null
                  : '"userId"'

              let result
              if (relationColumn) {
                result = await client.query(
                  `SELECT COUNT(*)::int AS count FROM "${table}" WHERE ${relationColumn} = $1`,
                  [userId]
                )
              } else if (table === 'QueryVersion') {
                result = await client.query(
                  'SELECT COUNT(*)::int AS count FROM "QueryVersion" qv JOIN "Query" q ON q.id = qv."queryId" WHERE q."userId" = $1',
                  [userId]
                )
              } else {
                result = await client.query(
                  'SELECT COUNT(*)::int AS count FROM "RoutineVersion" rv JOIN "Routine" r ON r.id = rv."routineId" WHERE r."userId" = $1',
                  [userId]
                )
              }

              if (result.rows[0].count !== expected) {
                throw new Error(`${table}: expected ${expected}, got ${result.rows[0].count}`)
              }
            }

            const apiKeys = await client.query(
              'SELECT COUNT(*)::int AS count FROM "ApiKey" WHERE "userId" = $1',
              [userId]
            )
            const aiConfig = await client.query(
              'SELECT COUNT(*)::int AS count FROM "UserAIConfig" WHERE "userId" = $1',
              [userId]
            )

            if (apiKeys.rows[0].count !== 0 || aiConfig.rows[0].count !== 0) {
              throw new Error('Demo seed must not create API keys or AI provider secrets')
            }

            await client.end()
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Validate security backfills
        run: |
          node <<'NODE'
          const { Client } = require('pg')

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL })
            await client.connect()

            const user = await client.query(
              'SELECT "id" FROM "User" WHERE "email" = $1',
              ['demo@sqlvault.local']
            )
            const userId = user.rows[0].id

            await client.query(
              'INSERT INTO "ApiKey" ("id", "name", "token", "tokenHash", "regeneratedAt", "createdAt", "userId") VALUES ($1, $2, $3, NULL, NOW(), NOW(), $4)',
              ['legacy-key-ci', 'Legacy CI key', 'legacy-ci-token', userId]
            )

            await client.query(
              'INSERT INTO "UserAIConfig" ("id", "userId", "provider", "model", "openaiApiKey", "createdAt", "updatedAt") VALUES ($1, $2, $3, $4, $5, NOW(), NOW())',
              ['legacy-ai-ci', userId, 'openai', 'gpt-4.1', 'sk-legacy-ci-secret']
            )

            await client.end()
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

          npm run db:backfill:api-key-hashes
          npm run db:backfill:api-key-hashes
          npm run db:encrypt:ai-secrets
          npm run db:encrypt:ai-secrets

          node <<'NODE'
          const { Client } = require('pg')
          const { createHash } = require('node:crypto')

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL })
            await client.connect()

            const key = await client.query(
              'SELECT "token", "tokenHash" FROM "ApiKey" WHERE "id" = $1',
              ['legacy-key-ci']
            )
            const expectedHash = createHash('sha256')
              .update('legacy-ci-token', 'utf8')
              .digest('hex')

            if (key.rows[0].token !== 'legacy-ci-token') {
              throw new Error('Transitional plaintext token changed unexpectedly')
            }
            if (key.rows[0].tokenHash !== expectedHash) {
              throw new Error('API key hash backfill failed')
            }

            const config = await client.query(
              'SELECT "openaiApiKey" FROM "UserAIConfig" WHERE "id" = $1',
              ['legacy-ai-ci']
            )
            const stored = config.rows[0].openaiApiKey

            if (stored === 'sk-legacy-ci-secret' || !stored.startsWith('enc:v1:')) {
              throw new Error('AI credential encryption backfill failed')
            }

            await client.end()
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqlvault
          POSTGRES_PASSWORD: sqlvault
          POSTGRES_DB: sqlvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlvault -d sqlvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate:deploy

      - name: Seed deterministic demo data
        env:
          ALLOW_DEMO_SEED: "true"
        run: npm run db:seed:demo

      - name: Build application
        run: npm run build

      - name: Run Playwright E2E suite
        env:
          CI: "true"
          AUTH_TRUST_HOST: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container-health:
    name: Container health
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Docker environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=sqlvault
          POSTGRES_PASSWORD=sqlvault
          POSTGRES_DB=sqlvault
          POSTGRES_PORT=5432
          AUTH_SECRET=ci-only-docker-auth-secret-with-at-least-32-characters
          AI_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUTH_TRUST_HOST=true
          NEXTAUTH_URL=http://localhost:3000
          DATABASE_URL=postgresql://sqlvault:sqlvault@localhost:5432/sqlvault?schema=public
          DOCKER_DATABASE_URL=postgresql://sqlvault:sqlvault@db:5432/sqlvault?schema=public
          EOF
          docker compose config

      - name: Build image
        run: docker compose build

      - name: Verify vulnerable tooling is absent from runtime image
        run: |
          docker run --rm --entrypoint node sql-vault:local -e "
            const forbidden = ['prisma', 'mysql2', 'deepmerge-ts', 'braces'];
            for (const name of forbidden) {
              try {
                require.resolve(name);
                console.error(name + ' unexpectedly exists in runtime image');
                process.exit(1);
              } catch (error) {
                if (error && error.code !== 'MODULE_NOT_FOUND') throw error;
              }
            }
            console.log('tooling-only vulnerable packages are absent from runtime image');
          "

      - name: Start application and PostgreSQL
        run: docker compose up -d

      - name: Wait for healthy services
        run: |
          for i in $(seq 1 45); do
            app_status="$(docker inspect --format='{{.State.Health.Status}}' sql-vault 2>/dev/null || true)"
            db_status="$(docker inspect --format='{{.State.Health.Status}}' sql-vault-db 2>/dev/null || true)"

            if [ "$app_status" = "healthy" ] && [ "$db_status" = "healthy" ]; then
              docker compose ps
              curl -fsS http://127.0.0.1:3000/api/health
              exit 0
            fi

            if [ "$app_status" = "unhealthy" ] || [ "$db_status" = "unhealthy" ]; then
              docker compose logs --no-color
              exit 1
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify application runs as non-root
        run: |
          docker compose exec -T app node -e "const uid=process.getuid?.(); console.log('uid='+uid); if(uid===0) process.exit(1)"

      - name: Validate documented demo seed command inside container
        run: |
          docker compose exec -T -e ALLOW_DEMO_SEED=true app npm run db:seed:demo
          count="$(docker compose exec -T db psql -U sqlvault -d sqlvault -Atc "SELECT COUNT(*) FROM \"User\" WHERE email = 'demo@sqlvault.local';")"
          test "$count" = "1"

      - name: Verify PostgreSQL persistence across app restart
        run: |
          docker compose exec -T db psql -U sqlvault -d sqlvault -c             "CREATE TABLE IF NOT EXISTS __docker_validation (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO __docker_validation(id, value) VALUES (1, 'persisted') ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;"
          docker compose restart app
          for i in $(seq 1 30); do
            app_status="$(docker inspect --format='{{.State.Health.Status}}' sql-vault 2>/dev/null || true)"
            if [ "$app_status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          value="$(docker compose exec -T db psql -U sqlvault -d sqlvault -Atc "SELECT value FROM __docker_validation WHERE id = 1;")"
          test "$value" = "persisted"

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans


  production-stack:
    name: Production stack
    runs-on: ubuntu-latest
    needs: container-health
    env:
      SQLVAULT_DOMAIN: http://localhost
      ACME_EMAIL: ci@example.com
      POSTGRES_USER: sqlvault
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: sqlvault
      DATABASE_URL: postgresql://sqlvault:ci-postgres-password@db:5432/sqlvault?schema=public
      NEXTAUTH_URL: http://localhost
      AUTH_SECRET: ci-production-auth-secret-with-at-least-32-characters
      AUTH_TRUST_HOST: "true"
      AI_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      OLLAMA_BASE_URL: ""
      ALLOW_DEMO_SEED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare production environment
        run: |
          cat > .env.production <<'EOF'
          SQLVAULT_DOMAIN=http://localhost
          ACME_EMAIL=ci@example.com
          POSTGRES_USER=sqlvault
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=sqlvault
          DATABASE_URL=postgresql://sqlvault:ci-postgres-password@db:5432/sqlvault?schema=public
          NEXTAUTH_URL=http://localhost
          AUTH_SECRET=ci-production-auth-secret-with-at-least-32-characters
          AUTH_TRUST_HOST=true
          AI_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          OLLAMA_BASE_URL=
          ALLOW_DEMO_SEED=false
          EOF

          docker compose --env-file .env.production -f docker-compose.prod.yml config
          docker compose --env-file .env.production -f docker-compose.prod.yml config --format json > /tmp/prod-compose.json

          node <<'NODE'
          const fs = require('node:fs')
          const config = JSON.parse(fs.readFileSync('/tmp/prod-compose.json', 'utf8'))

          const appPorts = config.services.app.ports ?? []
          const dbPorts = config.services.db.ports ?? []
          const caddyPorts = config.services.caddy.ports ?? []

          if (appPorts.length !== 0) throw new Error('Production app must not publish host ports')
          if (dbPorts.length !== 0) throw new Error('Production database must not publish host ports')
          if (caddyPorts.length < 2) throw new Error('Caddy must publish HTTP/HTTPS ports')
          if (config.networks.backend.internal !== true) {
            throw new Error('Production backend network must be internal')
          }
          NODE

      - name: Build production image
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build app migrate

      - name: Start production stack
        run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d

      - name: Wait for Caddy proxy and application health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/health | grep -q '"status":"ok"'; then
              docker compose --env-file .env.production -f docker-compose.prod.yml ps
              exit 0
            fi
            sleep 2
          done

          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color
          exit 1

      - name: Verify only Caddy publishes host ports
        run: |
          app_bindings="$(docker inspect --format='{{json .HostConfig.PortBindings}}' sql-vault)"
          db_bindings="$(docker inspect --format='{{json .HostConfig.PortBindings}}' sql-vault-db)"
          caddy_bindings="$(docker inspect --format='{{json .HostConfig.PortBindings}}' sql-vault-caddy)"

          test "$app_bindings" = "{}"
          test "$db_bindings" = "{}"
          echo "$caddy_bindings" | grep -q '"80/tcp"'
          echo "$caddy_bindings" | grep -q '"443/tcp"'

      - name: Validate PostgreSQL backup and restore
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T db             psql -U sqlvault -d sqlvault -c             "CREATE TABLE __prod_backup_validation (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO __prod_backup_validation VALUES (1, 'restored');"

          backup_file="$(BACKUP_DIR=/tmp/sqlvault-backups sh deploy/backup-postgres.sh)"
          test -s "$backup_file"

          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T db             psql -U sqlvault -d sqlvault -c "DROP TABLE __prod_backup_validation;"

          docker compose --env-file .env.production -f docker-compose.prod.yml stop app caddy

          CONFIRM_RESTORE=sqlvault sh deploy/restore-postgres.sh "$backup_file"

          value="$(docker compose --env-file .env.production -f docker-compose.prod.yml exec -T db             psql -U sqlvault -d sqlvault -Atc "SELECT value FROM __prod_backup_validation WHERE id = 1;")"
          test "$value" = "restored"

          docker compose --env-file .env.production -f docker-compose.prod.yml up -d app caddy

          for i in $(seq 1 45); do
            if curl -fsS http://localhost/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Cleanup production stack
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml down -v --remove-orphans
