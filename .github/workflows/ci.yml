name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: file:./prisma/dev.db
  AUTH_SECRET: ci-only-not-a-production-secret
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  container-health:
    name: Container health
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Docker environment
        run: |
          cat > .env <<'EOF'
          AUTH_SECRET=ci-only-docker-secret
          AUTH_TRUST_HOST=true
          NEXTAUTH_URL=http://localhost:3000
          DOCKER_DATABASE_URL=file:/data/dev.db
          EOF
          docker compose config

      - name: Build image
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' sql-vault 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              docker compose ps
              curl -fsS http://127.0.0.1:3000/api/health
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs --no-color app
              exit 1
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color app
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
