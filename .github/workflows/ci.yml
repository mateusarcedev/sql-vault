name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://sqlvault:sqlvault@localhost:5432/sqlvault?schema=public
  AUTH_SECRET: ci-only-not-a-production-secret
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqlvault
          POSTGRES_PASSWORD: sqlvault
          POSTGRES_DB: sqlvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlvault -d sqlvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate:deploy

      - name: Verify PostgreSQL migration status
        run: npx prisma migrate status

      - name: Verify PostgreSQL schema
        run: |
          node <<'NODE'
          const { Client } = require('pg')

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL })
            await client.connect()

            const tables = await client.query(
              "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public'"
            )
            const tableNames = new Set(tables.rows.map((row) => row.table_name))

            for (const expected of ['User', 'Query', 'Routine', 'DatabaseContext', 'ApiKey']) {
              if (!tableNames.has(expected)) {
                throw new Error(`Missing expected table: ${expected}`)
              }
            }

            const indexes = await client.query(
              "SELECT indexname FROM pg_indexes WHERE schemaname = 'public'"
            )
            const indexNames = new Set(indexes.rows.map((row) => row.indexname))

            for (const expected of [
              'Query_userId_isPublic_idx',
              'Query_databaseId_idx',
              'Routine_userId_isPublic_idx',
              'Routine_databaseId_idx',
              'DatabaseContext_userId_isPublic_idx',
            ]) {
              if (!indexNames.has(expected)) {
                throw new Error(`Missing expected index: ${expected}`)
              }
            }

            await client.end()
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  container-health:
    name: Container health
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Docker environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=sqlvault
          POSTGRES_PASSWORD=sqlvault
          POSTGRES_DB=sqlvault
          POSTGRES_PORT=5432
          AUTH_SECRET=ci-only-docker-secret
          AUTH_TRUST_HOST=true
          NEXTAUTH_URL=http://localhost:3000
          DATABASE_URL=postgresql://sqlvault:sqlvault@localhost:5432/sqlvault?schema=public
          DOCKER_DATABASE_URL=postgresql://sqlvault:sqlvault@db:5432/sqlvault?schema=public
          EOF
          docker compose config

      - name: Build image
        run: docker compose build

      - name: Start application and PostgreSQL
        run: docker compose up -d

      - name: Wait for healthy services
        run: |
          for i in $(seq 1 45); do
            app_status="$(docker inspect --format='{{.State.Health.Status}}' sql-vault 2>/dev/null || true)"
            db_status="$(docker inspect --format='{{.State.Health.Status}}' sql-vault-db 2>/dev/null || true)"

            if [ "$app_status" = "healthy" ] && [ "$db_status" = "healthy" ]; then
              docker compose ps
              curl -fsS http://127.0.0.1:3000/api/health
              exit 0
            fi

            if [ "$app_status" = "unhealthy" ] || [ "$db_status" = "unhealthy" ]; then
              docker compose logs --no-color
              exit 1
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify PostgreSQL persistence across app restart
        run: |
          docker compose exec -T db psql -U sqlvault -d sqlvault -c             "CREATE TABLE IF NOT EXISTS __docker_validation (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO __docker_validation(id, value) VALUES (1, 'persisted') ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;"
          docker compose restart app
          for i in $(seq 1 30); do
            app_status="$(docker inspect --format='{{.State.Health.Status}}' sql-vault 2>/dev/null || true)"
            if [ "$app_status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          value="$(docker compose exec -T db psql -U sqlvault -d sqlvault -Atc "SELECT value FROM __docker_validation WHERE id = 1;")"
          test "$value" = "persisted"

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
