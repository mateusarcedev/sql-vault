name: PostgreSQL bootstrap temporary

on:
  push:
    branches:
      - feat/postgresql-migration

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://sqlvault:sqlvault@localhost:5432/sqlvault?schema=public

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqlvault
          POSTGRES_PASSWORD: sqlvault
          POSTGRES_DB: sqlvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlvault -d sqlvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/postgresql-migration

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh lockfile and install dependencies
        run: npm install

      - name: Generate PostgreSQL baseline migration
        run: |
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/20261003000000_postgresql_baseline
          npx prisma migrate diff             --from-empty             --to-schema prisma/schema.prisma             --script             --output prisma/migrations/20261003000000_postgresql_baseline/migration.sql
          cat > prisma/migrations/migration_lock.toml <<'EOF'
          # Please do not edit this file manually
          # It should be added in your version-control system (e.g., Git)
          provider = "postgresql"
          EOF

      - name: Validate baseline on clean PostgreSQL
        run: |
          npm run prisma:generate
          npm run db:migrate:deploy
          npm run db:migrate:deploy
          npx prisma migrate status

      - name: Commit generated lockfile and migration baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations
          git commit -m "chore: generate postgresql migration baseline" || exit 0
          git push
