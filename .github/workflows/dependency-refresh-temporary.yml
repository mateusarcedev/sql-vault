name: Dependency refresh temporary

on:
  push:
    branches:
      - chore/portfolio-polish

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/portfolio-polish

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Use current npm resolver
        run: |
          npm install --global npm@11
          npm --version

      - name: Regenerate dependency lockfile
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm audit fix || true

      - name: Validate refreshed dependencies
        run: |
          npm run prisma:generate
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Validate strict audit allowlist
        run: node scripts/check-audit.mjs

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh lockfile after security updates" || exit 0
          git push
