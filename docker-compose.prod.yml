services:
  db:
    image: postgres:17-alpine
    container_name: sql-vault-db
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - sql_vault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: sql-vault:prod
    container_name: sql-vault
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY is required}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: sql-vault-caddy
    env_file:
      - .env.production
    environment:
      SQLVAULT_DOMAIN: ${SQLVAULT_DOMAIN:?SQLVAULT_DOMAIN is required}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - frontend

volumes:
  sql_vault_postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
